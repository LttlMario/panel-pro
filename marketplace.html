<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Panel</title>
    <!-- Tailwind CSS CDN -->
    <link rel="stylesheet" href="css/tailwind.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
    <script src="js/supabase-config.js?v=20260818-console-fix"></script>
    <script src="js/permissions.js?v=4.6.0"></script>
    <script src="js/panel-layout.js?v=4.14.0"></script>
    <link rel="stylesheet" href="css/global-footer.css">
    <script src="js/project-version.js?v=3.10.0"></script>
    <link rel="icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/logo-180.png">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex text-sm">

    <!-- Containerul Principal -->
    <div class="flex h-screen w-full overflow-hidden">

        <!-- Sidebar / Meniu Lateral preluat direct din scriptul de pontaj -->

        <!-- Conținut Principal Marketplace -->
        <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <div class="p-8 space-y-6 max-w-7xl mx-auto w-full">
            <section class="panel-action-bar"><div><button onclick="incarcaAnunturi()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition cursor-pointer flex items-center space-x-1.5"><span>🔄</span><span>Reîmprospătare</span></button></div></section>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                    <!-- COLOANA STANGA: Adăugare Anunț Nou -->
                    <div class="lg:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg space-y-4">
                        <h3 class="text-base font-bold text-slate-100 pb-2 border-b border-slate-800">Adaugă Anunț Nou</h3>

                        <form id="marketForm" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Nume:</label>
                                <input type="text" id="nume" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500" required>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Nr. tel.:</label>
                                <input type="text" id="telefon" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500" required>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Tip Acțiune:</label>
                                <select id="tipAcțiune" onchange="toggleTipActiune()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500">
                                    <option value="Vânzare">Vânzare</option>
                                    <option value="Cumpărare">Cumpărare</option>
                                    <option value="Servicii">Servicii</option>
                                </select>
                            </div>

                            <!-- Câmpul de Categorie (ascuns dacă selectează Servicii) -->
                            <div id="categorie-wrapper">
                                <label class="block text-xs font-medium text-slate-400 mb-1">Categorie:</label>
                                <select id="categorie" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500">
                                    <option value="CASE">CASE</option>
                                    <option value="VEHICULE">VEHICULE</option>
                                    <option value="BUNURI">BUNURI</option>
                                </select>
                            </div>

                            <!-- Câmpul de Produse (ascuns dacă selectează Servicii) -->
                            <div id="produse-wrapper">
                                <label class="block text-xs font-medium text-slate-400 mb-1">Produse (folosește Enter):</label>
                                <textarea id="produse" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500" placeholder="- Produs 1&#10;- Produs 2" required></textarea>
                            </div>

                            <!-- Câmpul specific pentru Servicii (afișat doar dacă se selectează Servicii) -->
                            <div id="servicii-box-wrapper" class="hidden">
                                <label class="block text-xs font-medium text-slate-400 mb-1">Ce servicii ceri sau prestezi:</label>
                                <textarea id="detalii_servicii" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500" placeholder="Descrie serviciul pe care îl oferi sau îl soliciți..."></textarea>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Preț (Obligatoriu):</label>
                                <input type="text" id="pret" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500" placeholder="Ex: 1500 sau 10000 sau Negociabil" required>
                            </div>

                            <!-- Câmp suplimentar explicit pentru Link Imagine Directă (opțional) -->
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Link Direct Imagine (Opțional):</label>
                                <input type="url" id="imagine_url_direct" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500" placeholder="https://imgur.com/... sau link direct imagine">
                            </div>

                            <!-- Secțiune pentru Upload Imagini Multiple prin Click + Paste (Ctrl + V) -->
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Imagini Anunț (Maxim 5, Opțional):</label>
                                <div id="paste-zone" tabindex="0" class="w-full bg-slate-950 border border-dashed border-slate-700 hover:border-blue-500 rounded-xl p-3 text-center cursor-pointer transition focus:outline-none focus:border-blue-500">
                                    <p class="text-xs text-slate-400" id="paste-instruction">📋 Apasă aici, iar după apasă <strong class="text-slate-200">Ctrl + V</strong> pentru a atașa imaginile</p>
                                    <div id="paste-preview-container" class="hidden mt-2 grid grid-cols-5 gap-2">
                                        <!-- Aici se vor adăuga dinamic previzualizările imaginilor -->
                                    </div>
                                </div>
                                <input type="hidden" id="imagini_json" value="[]">
                            </div>

                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl transition text-xs shadow-md cursor-pointer">Publică Anunțul</button>
                        </form>
                    </div>

                    <!-- COLOANA DREAPTA: Filtrare și Anunțuri Active -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
                            <h3 class="text-base font-bold text-slate-100 mb-3 pb-2 border-b border-slate-800">Filtrează Anunțurile</h3>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Selectează Categoria / Tipul:</label>
                                <select id="filtruCategorie" onchange="incarcaAnunturi()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500">
                                    <option value="TOATE">Toate Categoriile & Serviciile</option>
                                    <option value="CASE">CASE</option>
                                    <option value="VEHICULE">VEHICULE</option>
                                    <option value="BUNURI">BUNURI</option>
                                    <option value="SERVICII">SERVICII</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-bold text-slate-100">Anunțuri Active</h3>
                            <span id="itemCount" class="text-xs text-slate-400">0 produse</span>
                        </div>

                        <div id="listaAnunturi" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <p class="text-xs text-slate-500 text-center py-6 col-span-full">Se încarcă anunțurile...</p>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Modal pentru mărirea imaginilor (LightBox) -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="inchideModalImagine()">
        <div class="relative max-w-4xl max-h-[90vh]" onclick="event.stopPropagation()">
            <button onclick="inchideModalImagine()" class="absolute -top-4 -right-4 bg-slate-800 hover:bg-rose-600 text-white rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold shadow-lg transition cursor-pointer">×</button>
            <img id="modalImg" src="" alt="Imagine mărită" class="max-w-full max-h-[85vh] rounded-2xl border border-slate-700 shadow-2xl object-contain">
        </div>
    </div>

    <!-- Script de integrare Supabase și interfață -->
    <script>
        const SUPABASE_URL = window.PANEL_SUPABASE_CONFIG.url;
        const SUPABASE_KEY = window.PANEL_SUPABASE_CONFIG.publishableKey;
        const supabaseClient = window.createPanelSupabaseClient();

        let currentUser = {
            discord_id: '',
            display_name: '',
            role: '',
            organization_id: '',
            organization_name: ''
        };

        // Gestionare Imagini Multiple prin Paste (Maxim 5)
        let imaginiCurente = [];
        let marketplaceFocusHandled = false;
        const pasteZone = document.getElementById('paste-zone');
        const pasteInstruction = document.getElementById('paste-instruction');
        const pastePreviewContainer = document.getElementById('paste-preview-container');
        const imaginiJsonInput = document.getElementById('imagini_json');

        pasteZone.addEventListener('paste', async (e) => {
            e.preventDefault();
            if (imaginiCurente.length >= 5) {
                alert('Poți adăuga maximum 5 imagini per anunț!');
                return;
            }

            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    if (imaginiCurente.length >= 5) break;
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const base64Data = event.target.result;
                        imaginiCurente.push(base64Data);
                        actualizeazaPrevizualizariImagini();
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        function actualizeazaPrevizualizariImagini() {
            imaginiJsonInput.value = JSON.stringify(imaginiCurente);
            pastePreviewContainer.innerHTML = '';

            if (imaginiCurente.length > 0) {
                pasteInstruction.classList.add('hidden');
                pastePreviewContainer.classList.remove('hidden');

                imaginiCurente.forEach((imgSrc, index) => {
                    pastePreviewContainer.innerHTML += `
                        <div class="relative inline-block">
                            <img src="${imgSrc}" alt="Previzualizare ${index + 1}" class="h-16 w-full rounded-lg border border-slate-700 object-cover">
                            <button type="button" onclick="stergeImagineIndex(event, ${index})" class="absolute -top-1.5 -right-1.5 bg-rose-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] hover:bg-rose-500 shadow">×</button>
                        </div>
                    `;
                });
            } else {
                pastePreviewContainer.classList.add('hidden');
                pasteInstruction.classList.remove('hidden');
            }
        }

        function stergeImagineIndex(e, index) {
            e.stopPropagation();
            imaginiCurente.splice(index, 1);
            actualizeazaPrevizualizariImagini();
            pasteZone.focus();
        }

        function deschideModalImagine(url) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = url;
            modal.classList.remove('hidden');
        }

        function inchideModalImagine() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
        }

        function toggleTipActiune() {
            const tip = document.getElementById('tipAcțiune').value;
            const categorieWrapper = document.getElementById('categorie-wrapper');
            const produseWrapper = document.getElementById('produse-wrapper');
            const serviciiWrapper = document.getElementById('servicii-box-wrapper');
            const produseInput = document.getElementById('produse');

            if (tip === 'Servicii') {
                categorieWrapper.classList.add('hidden');
                produseWrapper.classList.add('hidden');
                serviciiWrapper.classList.remove('hidden');
                produseInput.required = false;
            } else {
                categorieWrapper.classList.remove('hidden');
                produseWrapper.classList.remove('hidden');
                serviciiWrapper.classList.add('hidden');
                produseInput.required = true;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll('.nav-link').forEach(link => {
                const linkHref = link.getAttribute('href');
                if (linkHref === currentPage) {
                    link.classList.remove('text-slate-300', 'hover:bg-slate-800');
                    link.classList.add('bg-emerald-500/10', 'text-emerald-400', 'font-medium');
                }
            });

            const cachedUser = localStorage.getItem('discord_user');
            if (!cachedUser) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const localData = JSON.parse(cachedUser);
                if (!localData || !localData.discord_id) {
                    window.location.href = 'login.html';
                    return;
                }

                let { data: dbUser, error } = await supabaseClient
                    .from('users')
                    .select('discord_id,username,display_name,avatar,role,default_role')
                    .eq('discord_id', localData.discord_id)
                    .maybeSingle();

                let activeUser = dbUser ? { ...localData, ...dbUser } : localData;

                currentUser.discord_id = activeUser.discord_id;
                currentUser.display_name = activeUser.display_name || activeUser.username || 'Utilizator Discord';
                currentUser.role = activeUser.role || activeUser.default_role || '';
                currentUser.organization_id =
                    window.getActiveOrganizationId?.() ||
                    activeUser.organization_id ||
                    localData.organization_id ||
                    '';
                activeUser.organization_id = currentUser.organization_id;
                window.PANEL_ACTIVE_ORGANIZATION_ID = currentUser.organization_id;

                if (currentUser.organization_id) {
                    const { data: organizationData, error: organizationError } =
                        await supabaseClient
                            .from('organizations')
                            .select('id, name')
                            .eq('id', currentUser.organization_id)
                            .maybeSingle();

                    if (!organizationError && organizationData) {
                        currentUser.organization_name = organizationData.name || '';
                    }
                }

                document.getElementById('nume').value = currentUser.display_name;

                if (typeof isPlatformAdmin === 'function' && isPlatformAdmin()) {
                    const navLogs = document.getElementById('nav-logs');
                    if (navLogs) navLogs.classList.remove('hidden');
                }

                localStorage.setItem('discord_user', JSON.stringify(activeUser));

            } catch (err) {
                console.error('Erore sesiune:', err);
                window.location.href = 'login.html';
                return;
            }

            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.clear();
                    window.location.href = 'login.html';
                });
            }

            incarcaAnunturi();
            aboneazaLaMarketplaceRealtime();
        });

        let marketplaceRealtimeChannel = null;

        function aboneazaLaMarketplaceRealtime() {
            if (marketplaceRealtimeChannel) return;

            marketplaceRealtimeChannel = supabaseClient
                .channel('marketplace-legal-global')
                .on(
                    'postgres_changes',
                    {
                        event: '*',
                        schema: 'public',
                        table: 'marketplace'
                    },
                    () => incarcaAnunturi()
                )
                .subscribe();
        }

        async function incarcaAnunturi() {
            const container = document.getElementById('listaAnunturi');
            const filtru = document.getElementById('filtruCategorie').value;
            container.innerHTML = '<p class="text-xs text-slate-500 text-center py-6 col-span-full">Se încarcă...</p>';

            const { data, error } = await supabaseClient
                .from('marketplace_feed')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = '<p class="text-xs text-rose-400 text-center py-6 col-span-full">Erore la încărcarea datelor: ' + escapeHtml(error.message) + '</p>';
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 text-center py-6 col-span-full">Nu există anunțuri momentan.</p>';
                document.getElementById('itemCount').innerText = '0 produse';
                return;
            }

            const anunturiFiltrate = data.filter(item => {
                if (filtru === 'TOATE') return true;
                if (filtru === 'SERVICII') return item.tip_actiune === 'Servicii' || item.categorie === 'SERVICII';
                return item.categorie === filtru;
            });

            document.getElementById('itemCount').innerText = `${anunturiFiltrate.length} produse`;

            if (anunturiFiltrate.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6 col-span-full">Nu există anunțuri în această secțiune.</p>`;
                return;
            }

            container.innerHTML = '';
            anunturiFiltrate.forEach(item => {
                let dataFormatata = '';
                if (item.created_at) {
                    const dataObj = new Date(item.created_at);
                    dataFormatata = dataObj.toLocaleString('ro-RO', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                    });
                }

                let tipBadge = item.tip_actiune || 'Vânzare';
                let badgeClass = tipBadge === 'Cumpărare' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : (tipBadge === 'Servicii' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20');

                let catBadge = item.categorie || '';
                if (tipBadge === 'Servicii') catBadge = 'SERVICII';
                const user = typeof getUser === 'function' ? getUser() : null;
                const esteAdministrator = typeof isPlatformAdmin === 'function' && isPlatformAdmin();
                const apartineOrganizatieiActive =
                    String(item.organization_id || '') === String(currentUser.organization_id || '');
                const poateSterge = esteAdministrator || (
                    apartineOrganizatieiActive &&
                    String(item.created_by_discord_id || '') === String(currentUser.discord_id || '')
                );
                const organizatieText = item.organization_name || 'Organizație legală';

                let continutAfisat = item.produse || '';
                if (tipBadge === 'Servicii') {
                    continutAfisat = `<strong>Serviciu Solicitat / Prestat:</strong>\n${item.produse}`;
                }

                continutAfisat = continutAfisat.replace(/\[(Vânzare|Cumpărare|Servicii)\]/gi, '').replace(/\[(CASE|VEHICULE|BUNURI|SERVICII)\]/gi, '').trim();

                let imaginiHtml = '';
                let listaImaginiFinala = [];

                if (item.imagine_url && item.imagine_url.trim() !== '') {
                    listaImaginiFinala.push(item.imagine_url.trim());
                }

                try {
                    if (item.imagini_json) {
                        const parsed = JSON.parse(item.imagini_json);
                        if (Array.isArray(parsed)) {
                            parsed.forEach(img => {
                                if (!listaImaginiFinala.includes(img)) listaImaginiFinala.push(img);
                            });
                        }
                    }
                } catch(e) {}

                if (listaImaginiFinala.length > 0) {
                    imaginiHtml = '<div class="flex flex-wrap gap-2 mt-2 pt-2 border-t border-slate-800/60">';
                    listaImaginiFinala.forEach(imgUrl => {
                        const urlCurat = imgUrl.trim();
                        // Dacă esteimagine base64 (din paste) sau link extern complet, o afișăm direct; altfel păstrăm calea locală img/
                        const sourcePrefix = (urlCurat.startsWith('data:image') || urlCurat.startsWith('http://') || urlCurat.startsWith('https://')) ? '' : 'img/';
                        imaginiHtml += `
                            <img src="${sourcePrefix}${urlCurat}" alt="Miniatură" class="rounded-lg h-10 w-10 object-cover border border-slate-700 cursor-pointer hover:opacity-90 transition" onclick="deschideModalImagine('${sourcePrefix}${urlCurat}')" title="Click pentru mărire">
                        `;
                    });
                    imaginiHtml += '</div>';
                }

                container.innerHTML += `
                    <div data-marketplace-id="${escapeHtml(item.id)}" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg flex flex-col justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="flex items-start justify-between">
                                <div>
                                    <span class="font-bold text-slate-100 text-sm">${escapeHtml(item.nume || '')}</span>
                                    <div class="text-[10px] text-emerald-400 mt-1">🏢 ${escapeHtml(organizatieText)}</div>
                                    <div class="text-xs text-slate-400 mt-0.5">Tel: ${escapeHtml(item.telefon || '')}</div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2 pt-1">
                                <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${badgeClass}">${tipBadge}</span>
                                ${catBadge ? `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">${catBadge}</span>` : ''}
                            </div>
                            <div class="bg-slate-950/50 border border-slate-800 p-3 rounded-xl text-xs text-slate-300 whitespace-pre-line">${escapeHtml(continutAfisat)}</div>
                        </div>
                        <div class="space-y-2">
                            <div class="border-t border-slate-800 pt-3 flex items-center justify-between text-xs">
                                <div>
                                    ${item.pret ? `<div class="font-bold text-emerald-400 text-sm">${escapeHtml(item.pret)}</div>` : ''}
                                </div>
                                <div>
                                    ${dataFormatata ? `<div class="text-[10px] text-slate-500">Publicat: ${dataFormatata}</div>` : ''}
                                    <a href="marketplace.html?anunt=${encodeURIComponent(item.id)}" class="mt-2 inline-block px-2.5 py-1 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 hover:bg-emerald-500/20 text-[10px] font-bold">Mergi la anunț</a>
                                    ${poateSterge ? `<button type="button" onclick="stergeAnuntMarketplace('${item.id}')" class="mt-2 px-2.5 py-1 rounded-lg border border-rose-500/30 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 text-[10px] font-bold">Șterge</button>` : ''}
                                </div>
                            </div>
                            ${imaginiHtml}
                        </div>
                    </div>
                `;
            });

            if (!marketplaceFocusHandled) {
                const focusId = new URLSearchParams(window.location.search).get('anunt');
                const focusedCard = focusId
                    ? container.querySelector(`[data-marketplace-id="${CSS.escape(focusId)}"]`)
                    : null;
                if (focusedCard) {
                    marketplaceFocusHandled = true;
                    focusedCard.classList.add('ring-2', 'ring-emerald-400');
                    focusedCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        async function stergeAnuntMarketplace(id) {
            if (!confirm('Ștergi definitiv acest anunț?')) return;
            const token = localStorage.getItem('discord_access_token');
            const response = await fetch(`${SUPABASE_URL}/functions/v1/manage-community-posts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, authorization: `Bearer ${SUPABASE_KEY}` },
                body: JSON.stringify({ action: 'marketplace_delete', table: 'marketplace', item_id: id, access_token: token })
            });
            const result = await response.json();
            if (!response.ok) return alert(result.error || 'Anunțul nu a putut fi șters.');
            await incarcaAnunturi();
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }

        async function trimitePeDiscord(anunt) {
            const fields = [
                { name: '👤 Nume', value: anunt.nume, inline: true },
                { name: '📞 Telefon', value: anunt.telefon, inline: true },
                { name: '📌 Tip Acțiune', value: anunt.tip_actiune, inline: true }
            ];

            if (anunt.tip_actiune !== 'Servicii') {
                fields.push({ name: '📁 Categorie', value: anunt.categorie, inline: false });
                fields.push({ name: '📦 Produse / Detalii', value: anunt.produse, inline: false });
            } else {
                fields.push({ name: '🛠️ Servicii Solicitate / Prestate', value: anunt.produse, inline: false });
            }

            fields.push({ name: '💰 Preț', value: anunt.pret, inline: true });
            fields.push({
                name: '🏢 Organizație',
                value: currentUser.organization_name || 'Organizație legală',
                inline: true
            });

            const formData = new FormData();
            let listaImaginiDiscord = [];

            try {
                let parsedImgs = JSON.parse(anunt.imagini_json || '[]');
                if (Array.isArray(parsedImgs)) {
                    listaImaginiDiscord = parsedImgs.filter(img => img && img.startsWith('data:image'));
                }
            } catch(e) {}

            let filesMap = {};

            listaImaginiDiscord.forEach((base64Data, index) => {
                const blob = dataURItoBlob(base64Data);
                const fileName = `imagine_${index + 1}.png`;
                formData.append(`files[${index}]`, blob, fileName);
                filesMap[index] = fileName;
            });

            const embedPrincipal = {
                title: '📢 Anunț Nou - Marketplace ',
                color: anunt.tip_actiune === 'Servicii' ? 10181046 : 38159,
                fields: fields,
                footer: { text: 'Publicat prin Marketplace  - Panel by Little Mario' },
                timestamp: new Date().toISOString()
            };

            const payload = {
                embeds: [embedPrincipal]
            };

            formData.append('payload_json', JSON.stringify(payload));

            try {
                const response = await sendPanelDiscord('marketplace', formData);

                if (!response.ok) {
                    const errText = await response.text();
                    console.error('Erore Discord Webhook API:', response.status, errText);
                    throw new Error(`Discord a refuzat anunțul (HTTP ${response.status}).`);
                }
                return response;
            } catch (err) {
                console.error('Erore de rețea la trimiterea pe Discord:', err);
                throw err;
            }
        }

        document.getElementById('marketForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const tipSelectat = document.getElementById('tipAcțiune').value;
            let pretValoare = document.getElementById('pret').value.trim();

            if (pretValoare === '') {
                alert('Trebuie să completezi prețul sau să scrii "negociabil" pentru a putea publica anunțul!');
                return;
            }

            if (/^\d+$/.test(pretValoare)) {
                let numar = parseInt(pretValoare, 10);
                if (numar >= 10000) {
                    pretValoare = numar.toLocaleString('ro-RO');
                }
                pretValoare += '$';
            } else {
                const contineLitere = /[a-zA-ZăâîșțĂÂÎȘȚ]/i.test(pretValoare);
                if (!contineLitere && !pretValoare.includes('$')) {
                    pretValoare += '$';
                }
            }

            let textProdus = '';
            let categorieSelectata = '';

            if (tipSelectat === 'Servicii') {
                textProdus = document.getElementById('detalii_servicii').value.trim();
                categorieSelectata = 'SERVICII';
                if (!textProdus) {
                    alert('Te rog completează ce servicii ceri sau prestezi!');
                    return;
                }
            } else {
                textProdus = document.getElementById('produse').value;
                categorieSelectata = document.getElementById('categorie').value;
            }

            const imaginiJsonValoare = document.getElementById('imagini_json').value;
            const imagineUrlDirectValoare = document.getElementById('imagine_url_direct').value.trim();

            const nouAnunt = {
                nume: document.getElementById('nume').value,
                display_name: null,
                telefon: document.getElementById('telefon').value,
                tip_actiune: tipSelectat,
                categorie: categorieSelectata,
                produse: textProdus,
                pret: pretValoare,
                imagini_json: imaginiJsonValoare,
                imagine_url: imagineUrlDirectValoare !== '' ? imagineUrlDirectValoare : null
                ,created_by_discord_id: currentUser.discord_id
                ,organization_id: currentUser.organization_id
            };

            const { data: savedAnunt, error } = await supabaseClient
                .from('marketplace')
                .insert([nouAnunt])
                .select('id')
                .single();

            if (error) {
                alert('Erore la salvare: ' + error.message);
            } else {
                let discordResponse;
                try {
                    discordResponse = await trimitePeDiscord({ ...nouAnunt, id: savedAnunt.id });
                } catch (discordError) {
                    alert(`Anunțul a fost salvat în panel, dar NU a fost trimis pe Discord: ${discordError.message}`);
                    return;
                }

                if (discordResponse?.ok) {
                    const discordResult = await discordResponse.json();
                    await supabaseClient.from('marketplace').update({ discord_message_ids: discordResult.messages || [] }).eq('id', savedAnunt.id);
                }

                alert('Anunț publicat și trimis cu succes pe Discord!');
                document.getElementById('marketForm').reset();
                document.getElementById('nume').value = currentUser.display_name;

                imaginiCurente = [];
                actualizeazaPrevizualizariImagini();

                toggleTipActiune();
                incarcaAnunturi();
            }
        });

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
