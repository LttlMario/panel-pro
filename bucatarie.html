<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Bucătărie - Little Mario Panel</title>
    <!-- Tailwind CSS CDN -->
    <link rel="stylesheet" href="css/tailwind.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
    <script src="js/supabase-config.js?v=20260820-session-date-fix"></script>
    <script src="js/permissions.js?v=4.6.0"></script>
    <script src="js/panel-layout.js?v=4.27.0"></script>
    <style>
        main {
            padding-bottom: 0 !important;
        }
        .zoom-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e293b;
            color: #f1f5f9;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            z-index: 10;
        }
        .zoom-btn:hover {
            background: #0f172a;
            border-color: #34d399;
        }
        .zoom-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .modal.active {
            display: flex;
        }
    </style>
    <link rel="stylesheet" href="css/global-footer.css">
    <script src="js/project-version.js?v=3.11.5"></script>
    <link rel="icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/logo-180.png">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex text-sm">

    <!-- Containerul Principal -->
    <div class="flex h-screen w-full overflow-hidden">

        <!-- Sidebar / Meniu Lateral -->

            <!-- Grila Galeriei - 29 Imagini bucatarie1.jpg - bucatarie29.jpg -->
        

        <!-- Conținutul Principal (Galerie Bucătărie) -->
        <main class="flex-1 overflow-y-auto p-0 flex flex-col items-center bg-slate-950">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6 w-full max-w-7xl px-4 md:px-8 pt-8 pb-8 mx-auto" id="galleryGrid">
            </div>
        </main>
    </div>

    <!-- Modal pentru Zoom Imagine -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <div class="relative max-w-5xl max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button class="absolute -top-12 right-0 text-slate-400 hover:text-white text-lg font-bold bg-slate-900 border border-slate-800 rounded-full w-9 h-9 flex items-center justify-center transition" onclick="closeModal()">✕</button>
            <img id="modalImg" src="" alt="Zoom" class="max-w-full max-h-[75vh] object-contain rounded-xl border border-slate-800 shadow-2xl bg-black">
            <div class="mt-4 text-center">
                <h3 id="modalTitle" class="text-lg font-semibold text-slate-100"></h3>
                <p id="modalDesc" class="text-xs text-slate-400 mt-1"></p>
            </div>
        </div>
    </div>

    <!-- Scripturi Supabase și Logica de Profil -->
    <script>
        const SUPABASE_URL = window.PANEL_SUPABASE_CONFIG?.url || '';
        const SUPABASE_KEY = window.PANEL_SUPABASE_CONFIG?.publishableKey || '';
        const supabaseClient = window.createPanelSupabaseClient ? window.createPanelSupabaseClient() : null;

        function filterGallery(value) {
            const input = String(value ?? document.getElementById('searchInput')?.value ?? '').toLowerCase();
            const cards = document.getElementsByClassName('gallery-card');

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].getAttribute('data-title').toLowerCase();
                const desc = cards[i].getAttribute('data-desc').toLowerCase();
                if (title.includes(input) || desc.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        function openModal(src, title, desc) {
            document.getElementById('modalImg').src = `img/${src}`;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = desc;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        async function loadUserProfile() {
            const cachedUser = localStorage.getItem('discord_user');
            if (!cachedUser) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const localData = JSON.parse(cachedUser);
                if (!localData || !localData.discord_id) {
                    window.location.href = 'login.html';
                    return;
                }

                let activeUser = localData;
                if (supabaseClient) {
                    const { data: dbUser } = await supabaseClient
                        .from('users')
                        .select('discord_id,username,display_name,avatar,role,default_role')
                        .eq('discord_id', localData.discord_id)
                        .maybeSingle();
                    if (dbUser) activeUser = { ...localData, ...dbUser };
                }

                localStorage.setItem('discord_user', JSON.stringify(activeUser));
            } catch (err) {
                console.error('Eroare la încărcarea profilului:', err);
            }
        }

        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                localStorage.clear();
                window.location.href = 'login.html';
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.remove('text-slate-300', 'hover:bg-slate-800');
                    link.classList.add('bg-emerald-500/10', 'text-emerald-400', 'font-medium');
                }
            });

            loadUserProfile();

            // Generare dinamică carduri bucatarie1.jpg - bucatarie29.jpg
            const gallery = document.getElementById('galleryGrid');
            if (gallery) {
                for (let number = 1; number <= 29; number++) {
                    const title = `Bucătărie ${number}`;
                    const description = `Imaginea ${number} din galeria de bucătărie.`;
                    const filename = `bucatarie${number}.jpg`;
                    const card = document.createElement('div');
                    card.className = 'gallery-card bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col transition hover:-translate-y-1 hover:border-emerald-500/50 shadow-lg';
                    card.dataset.title = title;
                    card.dataset.desc = description;
                    card.innerHTML = `
                      <div class="w-full h-48 bg-black relative overflow-hidden">
                        <img src="img/${filename}" alt="${title}" class="w-full h-full object-cover transition duration-300 hover:scale-105" style="cursor: zoom-in;">
                        <button class="zoom-btn" type="button" title="Mărește imaginea">
                            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        </button>
                      </div>
                      <div class="p-5 flex flex-col gap-2 flex-1">
                        <div class="font-semibold text-slate-100 text-base">${title}</div>
                        <div class="text-xs text-slate-400 leading-relaxed">${description}</div>
                      </div>`;
                    
                    card.querySelector('.zoom-btn').addEventListener('click', () => openModal(filename, title, description));
                    card.querySelector('img').addEventListener('click', () => openModal(filename, title, description));
                    gallery.appendChild(card);
                }
            }
        });
    </script>
    <script src="js/global-footer.js"></script>
</body>
</html>
