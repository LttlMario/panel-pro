name: Panel checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "3.6.0"' js/project-version.js
          grep -q 'id="v-3.6.0"' changelog.html

      - name: Validate Supabase deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          test -f supabase/deploy-functions.ps1
          test -f supabase/migrations/20260813000300_shifts_history_composite_index.sql
