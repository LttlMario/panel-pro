name: Panel checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "3.13.1"' js/project-version.js
          grep -q 'id="v-3.13.1"' changelog.html

      - name: Validate Supabase deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          test -f supabase/deploy-functions.ps1
          test -f supabase/migrations/20260813000300_shifts_history_composite_index.sql
          test ! -f supabase/MASTER-MULTI-ORGANIZATIE.sql

      - name: Validate Supabase Function TypeScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            npx --yes esbuild "$file" --loader:.ts=ts --format=esm --outfile=/dev/null --log-level=error
          done < <(find supabase/functions -type f -name '*.ts' -print0)

      - name: Validate inline JavaScript and deployment parity
        run: node tools/validate-panel.mjs

      - name: Validate Discord delivery and automation contracts
        run: node tools/validate-discord-stability.mjs

      - name: Audit approved Panel Pro upgrades
        run: node tools/validate-panel-upgrades.mjs

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude='*.map' \
            'https://discord(app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9._-]+' .
          ! grep -RInE --exclude-dir=.git --exclude='*.map' \
            '-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----' .
