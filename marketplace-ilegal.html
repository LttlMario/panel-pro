<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex text-sm">

    <!-- Containerul Principal -->

        <!-- Sidebar / Meniu Lateral preluat direct din layout-ul standard al proiectului -->

        <!-- Conținut Principal Black Market -->
        <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <div class="p-8 space-y-6 max-w-7xl mx-auto w-full">
            <section class="panel-action-bar"><div><button onclick="incarcaAnunturi()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition cursor-pointer flex items-center space-x-1.5"><span>🔄</span><span>Reîmprospătare</span></button></div></section>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                    <!-- COLOANA STANGA: Adăugare Anunț Nou -->
                    <div class="lg:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg space-y-4">
                        <h3 class="text-base font-bold text-slate-100 pb-2 border-b border-slate-800">Adaugă Anunț Ilegal</h3>

                        <form id="marketForm" class="space-y-4">

                            <div id="containerCategorie">

                                    <option value="Muniție">Muniție</option>

                            <!-- Dropdown dinamic pentru Arme/Muniție -->
                            <div id="containerSubcategorie" class="hidden">
                                <label id="labelSubcategorie" class="block text-xs font-medium text-slate-400 mb-1">Selectează elementul:</label>

                            <div>
                                <label id="labelProduse" class="block text-xs font-medium text-slate-400 mb-1">Produse / Descriere (folosește Enter):</label>
                                <textarea id="produse" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-rose-500" placeholder="- Detaliu 1&#10;- Detaliu 2" required></textarea>
                            </div>

                            <div>
                                <label id="labelPret" class="block text-xs font-medium text-slate-400 mb-1">Preț (Obligatoriu):</label>
                                <input type="text" id="pret" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-rose-500" placeholder="Ex: 1500 sau Negociabil" required>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Link Direct Imagine (Opțional):</label>
                                <input type="url" id="imagine_url_direct" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-rose-500" placeholder="https://... sau link direct imagine">
                            </div>

                            <!-- Secțiune pentru Upload Imagini Multiple prin Click + Paste (Ctrl + V) -->
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Imagini Anunț (Maxim 5, Opțional):</label>
                                <div id="paste-zone" tabindex="0" class="w-full bg-slate-950 border border-dashed border-slate-700 hover:border-rose-500 rounded-xl p-3 text-center cursor-pointer transition focus:outline-none focus:border-rose-500">
                                    <p class="text-xs text-slate-400" id="paste-instruction">📋 Apasă aici, iar după apasă <strong class="text-slate-200">Ctrl + V</strong> pentru a atașa imaginile</p>
                                    <div id="paste-preview-container" class="hidden mt-2 grid grid-cols-5 gap-2">
                                        <!-- Aici se vor adăuga dinamic previzualizările imaginilor -->
                                    </div>
                                </div>
                                <input type="hidden" id="imagini_json" value="[]">
                            </div>

                            <button id="marketSubmitBtn" type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 rounded-xl transition text-xs shadow-md cursor-pointer">Publică Anunțul</button>
                            <button id="marketCancelEditBtn" type="button" onclick="anuleazaEditareMarketplace()" class="hidden w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl transition text-xs cursor-pointer">Anulează editarea</button>
                        </form>
                    </div>

                    <!-- COLOANA DREAPTA: Filtrare și Anunțuri Active -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
                            <h3 class="text-base font-bold text-slate-100 mb-3 pb-2 border-b border-slate-800">Filtrează Anunțurile</h3>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Selectează Categoria / Tipul:</label>
                                <select id="filtruCategorie" onchange="incarcaAnunturi()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-rose-500">
                                    <option value="TOATE">Toate Anunțurile</option>
                                    <option value="Servicii">Servicii</option>
                                    <option value="Arme">Arme</option>
                                    <option value="Muniție">Muniție</option>
                                    <option value="Plicuri coca">Plicuri coca</option>
                                    <option value="Plicuri ciuperci">Plicuri ciuperci</option>

                                    <option value="Piese de armă">Piese de armă</option>
                                    <optgroup label="Arme (Specific)">
                                        <option value="Navy Pistol">Navy Pistol</option>
                                        <option value="Combat MG">Combat MG</option>
                                        <option value="Assault SMG">Assault SMG</option>
                                        <option value="Gadget Pistol">Gadget Pistol</option>
                                        <option value="Shotgun">Shotgun</option>
                                        <option value="Heavy Revolver">Heavy Revolver</option>
                                        <option value="MG">MG</option>
                                        <option value="Assault Rifle MK2">Assault Rifle MK2</option>
                                        <option value="Pistol">Pistol</option>
                                        <option value="Tec-9">Tec-9</option>
                                        <option value="Pistol Mk2">Pistol Mk2</option>
                                        <option value="Micro SMG">Micro SMG</option>
                                        <option value="Mini Ak">Mini Ak</option>
                                        <option value="Vintage Pistol">Vintage Pistol</option>
                                        <option value="SMG Mk2">SMG Mk2</option>
                                        <option value="Tommy Gun">Tommy Gun</option>
                                        <option value="DB">DB</option>
                                    </optgroup>
                                    <optgroup label="Muniție (Specific)">
                                        <option value=".9MM PBM">.9MM PBM</option>
                                        <option value=".9MM ACP">.9MM ACP</option>
                                        <option value=".38MM">.38MM</option>
                                        <option value="7.62MM">7.62MM</option>
                                        <option value=".44 Marlin">.44 Marlin</option>
                                        <option value="7.65 MM">7.65 MM</option>
                                    </optgroup>
                                </select>
                            </div>
                        </div>

                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-bold text-slate-100">Anunțuri Active</h3>
                            <span id="itemCount" class="text-xs text-slate-400">0 produse</span>
                        </div>

                        <div id="listaAnunturi" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <p class="text-xs text-slate-500 text-center py-6 col-span-full">Se încarcă anunțurile...</p>

                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Modal pentru mărirea imaginilor (LightBox) -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="inchideModalImagine()">
        <div class="relative max-w-4xl max-h-[90vh]" onclick="event.stopPropagation()">
            <button onclick="inchideModalImagine()" class="absolute -top-4 -right-4 bg-slate-800 hover:bg-rose-600 text-white rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold shadow-lg transition cursor-pointer">×</button>
            <img id="modalImg" src="" alt="Imagine mărită" class="max-w-full max-h-[85vh] rounded-2xl border border-slate-700 shadow-2xl object-contain">
        </div>
    </div>

    <!-- Script Supabase, Webhook Discord și Gestionare Upload/Paste Poze -->
    <script>
        const SUPABASE_URL = window.PANEL_SUPABASE_CONFIG.url;
        const SUPABASE_KEY = window.PANEL_SUPABASE_CONFIG.publishableKey;
        const supabaseClient = window.createPanelSupabaseClient();

        currentUser = {
            discord_id: '',
            username: '',
            display_name: 'Mecanic',
            role: 'Ilegal',
            panel_level: 0,
            organization_id: '',
            organization_name: '',
            illegal_organization_name: ''
        };

        let editingMarketplaceId = null;
        let marketplaceItems = [];
        const MARKETPLACE_PANEL_URL = 'https://lttlmario.github.io/panel-pro/marketplace-ilegal.html';
        let marketplaceFocusHandled = false;

        function normalizeBlackMarketName(value) {
            return String(value || '')
                .replace(/^\s*\d{1,12}\s+/u, '')
                .replace(/^\s*\d{1,12}\s*[|:/#-]\s*/u, '')
                .replace(/\s*[|:/#-]\s*\d{1,12}\s*$/u, '')
                .replace(/\s+\d{1,12}\s*$/u, '')
                .replace(/\s*[[(]\s*\d{1,12}\s*[\])]\s*$/u, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        const listeArmeMunitie = {
            "Arme": [
                "Navy Pistol", "Combat MG", "Assault SMG", "Gadget Pistol",
                "Shotgun", "Heavy Revolver", "MG", "Assault Rifle MK2",
                "Pistol", "Tec-9", "Pistol Mk2", "Micro SMG", "Mini Ak",
                "Vintage Pistol", "SMG Mk2", "Tommy Gun", "DB"
            ],
            "Muniție": [
                ".9MM PBM", ".9MM ACP", ".38MM", "7.62MM", ".44 Marlin", "7.65 MM"
            ]
        };

        // Gestionare Imagini Multiple prin Paste (Maxim 5)
        let imaginiCurente = [];
        const pasteZone = document.getElementById('paste-zone');
        const pasteInstruction = document.getElementById('paste-instruction');
        const pastePreviewContainer = document.getElementById('paste-preview-container');
        const imaginiJsonInput = document.getElementById('imagini_json');

        pasteZone.addEventListener('paste', async (e) => {
            e.preventDefault();
            if (imaginiCurente.length >= 5) {
                alert('Poți adăuga maximum 5 imagini per anunț!');
                return;
            }

            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    if (imaginiCurente.length >= 5) break;
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const base64Data = event.target.result;
                        imaginiCurente.push(base64Data);
                        actualizeazaPrevizualizariImagini();
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        function actualizeazaPrevizualizariImagini() {
            imaginiJsonInput.value = JSON.stringify(imaginiCurente);
            pastePreviewContainer.innerHTML = '';

            if (imaginiCurente.length > 0) {
                pasteInstruction.classList.add('hidden');
                pastePreviewContainer.classList.remove('hidden');

                imaginiCurente.forEach((imgSrc, index) => {
                    pastePreviewContainer.innerHTML += `
                        <div class="relative inline-block">
                            <img src="${imgSrc}" alt="Previzualizare ${index + 1}" class="h-16 w-full rounded-lg border border-slate-700 object-cover">
                            <button type="button" onclick="stergeImagineIndex(event, ${index})" class="absolute -top-1.5 -right-1.5 bg-rose-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] hover:bg-rose-500 shadow">×</button>
                        </div>
                    `;
                });
            } else {
                pastePreviewContainer.classList.add('hidden');
                pasteInstruction.classList.remove('hidden');
            }
        }

        function stergeImagineIndex(e, index) {
            e.stopPropagation();
            imaginiCurente.splice(index, 1);
            actualizeazaPrevizualizariImagini();
            pasteZone.focus();
        }

        function deschideModalImagine(url) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = url;
            modal.classList.remove('hidden');
        }

        function inchideModalImagine() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
        }

        function toggleTipActiune() {
            const tipAcțiune = document.getElementById('tipAcțiune').value;
            const labelPret = document.getElementById('labelPret');
            const inputPret = document.getElementById('pret');

            if (tipAcțiune === 'Cumpărare') {
                labelPret.innerText = "Preț (Opțional):";
                inputPret.required = false;
                inputPret.placeholder = "Ex: 1500 sau lăsați gol";
            } else {
                labelPret.innerText = "Preț (Obligatoriu):";
                inputPret.required = true;
                inputPret.placeholder = "Ex: 1500 sau Negociabil";
            }
        }

        function toggleCategorie() {
            const tipAcțiune = document.getElementById('tipAcțiune').value;
            const containerCategorie = document.getElementById('containerCategorie');
            const selectCategorie = document.getElementById('categorie');

            if (tipAcțiune === 'Servicii') {
                containerCategorie.style.display = 'none';
                selectCategorie.required = false;
                selectCategorie.value = '';
            } else {
                containerCategorie.style.display = 'block';
                selectCategorie.required = true;
            }
            toggleSubcategorie();
        }

        function toggleSubcategorie() {
            const categorie = document.getElementById('categorie').value;
            const containerSub = document.getElementById('containerSubcategorie');
            const selectSub = document.getElementById('subcategorie');
            const labelSub = document.getElementById('labelSubcategorie');
            const labelProduse = document.getElementById('labelProduse');
            const textareaProduse = document.getElementById('produse');

            if (listeArmeMunitie[categorie]) {
                containerSub.classList.remove('hidden');
                selectSub.required = true;
                labelSub.innerText = categorie === 'Arme' ? 'Selectează Arma:' : 'Selectează Muniția:';

                selectSub.innerHTML = '<option value="" disabled selected>-- Selectează --</option>';
                listeArmeMunitie[categorie].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.innerText = item;
                    selectSub.appendChild(opt);
                });

                labelProduse.innerText = "Cantitate / Descriere:";
                textareaProduse.placeholder = "Ex: 2 bucăți / Stare impecabilă";
            } else {
                containerSub.classList.add('hidden');
                selectSub.required = false;
                selectSub.innerHTML = '';

                labelProduse.innerText = "Produse / Descriere (folosește Enter):";
                textareaProduse.placeholder = "- Detaliu 1\n- Detaliu 2";
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll('.nav-link').forEach(link => {
                const linkHref = link.getAttribute('href');
                if (linkHref === currentPage) {
                    link.classList.remove('text-slate-300', 'hover:bg-slate-800');
                    link.classList.add('bg-rose-500/10', 'text-rose-400', 'font-medium');
                }
            });

            const cachedUser = localStorage.getItem('discord_user');
            if (!cachedUser) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const localData = JSON.parse(cachedUser);
                if (!localData || !localData.discord_id) {
                    window.location.href = 'login.html';
                    return;
                }

                let { data: dbUser, error: dbError } = await supabaseClient
                    .from('users')
                    .select('discord_id, username, display_name, email, avatar, role, default_role')
                    .eq('discord_id', localData.discord_id)
                    .maybeSingle();

                let activeUser = dbUser ? { ...localData, ...dbUser } : localData;

                currentUser.discord_id = activeUser.discord_id;
                currentUser.username = activeUser.username || '';
                currentUser.display_name = activeUser.display_name || activeUser.username || 'Mecanic';
                currentUser.role = activeUser.role || activeUser.default_role || 'Ilegal';
                currentUser.panel_level = Number(
                    activeUser.permission_level ||
                    activeUser.panel_level ||
                    localData.permission_level ||
                    localData.panel_level ||
                    0
                );

                currentUser.organization_id =
                    localData.organization_id ||
                    '';
                window.PANEL_ACTIVE_ORGANIZATION_ID = currentUser.organization_id;
                if (currentUser.organization_id) {
                    const { data: organizationData, error: organizationError } =
                        await supabaseClient
                            .from('organizations')
                            .select('id, name')
                            .select('id, name, illegal_name')
                            .eq('id', currentUser.organization_id)
                            .maybeSingle();

                    if (!organizationError && organizationData) {
                        currentUser.organization_name =
                            organizationData.name || '';
                        currentUser.illegal_organization_name =
                            organizationData.illegal_name || '';
                    }
                }

                const numeDeCompletat = currentUser.display_name || currentUser.username || '';
                document.getElementById('nume').value = normalizeBlackMarketName(numeDeCompletat);

                const roleLower = currentUser.role.toLowerCase();
                const isPrivileged = roleLower.includes('sef') || roleLower.includes('șef') || roleLower.includes('manager') || roleLower.includes('admin') || roleLower.includes('owner');

                if (isPrivileged) {
                    const navLogs = document.getElementById('nav-logs');
                    if (navLogs) navLogs.classList.remove('hidden');
                }

                localStorage.setItem('discord_user', JSON.stringify(activeUser));

            } catch (err) {
                console.error('Erore sesiune:', err);
                window.location.href = 'login.html';
                return;
            }

            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.clear();
                    window.location.href = 'login.html';
                });
            }

            if(document.getElementById('categorie')) {
                document.getElementById('categorie').selectedIndex = 0;
            }
            toggleTipActiune();
            toggleCategorie();
            incarcaAnunturi();
            aboneazaLaMarketplaceRealtime();
        });

        let marketplaceRealtimeChannel = null;

        function aboneazaLaMarketplaceRealtime() {
            if (marketplaceRealtimeChannel) return;

            marketplaceRealtimeChannel = supabaseClient
                .channel('marketplace-ilegal-global')
                .on(
                    'postgres_changes',
                    {
                        event: '*',
                        schema: 'public',
                        table: 'marketplace_ilegal'
                    },
                    () => incarcaAnunturi()
                )
                .subscribe();
        }

        async function incarcaAnunturi() {
            const container = document.getElementById('listaAnunturi');
            const filtru = document.getElementById('filtruCategorie').value;
            container.innerHTML = '<p class="text-xs text-slate-500 text-center py-6 col-span-full">Se încarcă...</p>';

            const { data, error } = await supabaseClient
                .from('marketplace_ilegal_feed')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = '<p class="text-xs text-rose-400 text-center py-6 col-span-full">Erore la încărcarea datelor: ' + escapeHtml(error.message) + '</p>';
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 text-center py-6 col-span-full">Nu există anunțuri momentan.</p>';
                document.getElementById('itemCount').innerText = '0 produse';
                return;
            }

            marketplaceItems = data;

            const anunturiFiltrate = data.filter(item => {
                if (filtru === 'TOATE') return true;
                if (filtru === 'Servicii') return item.tip_actiune === 'Servicii';
                if (item.categorie === filtru) return true;
                if (item.subcategorie === filtru) return true;
                return false;
            });

            document.getElementById('itemCount').innerText = `${anunturiFiltrate.length} produse`;

            if (anunturiFiltrate.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6 col-span-full">Nu există anunțuri în această secțiune.</p>`;
                return;
            }

            container.innerHTML = '';
            for (const item of anunturiFiltrate) {
                let dataFormatata = '';
                if (item.created_at) {
                    const dataObj = new Date(item.created_at);
                    dataFormatata = dataObj.toLocaleString('ro-RO', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }

                let tipBadge = item.tip_actiune || 'Vânzare';
                let badgeClass = tipBadge === 'Cumpărare' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : (tipBadge === 'Servicii' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20');

                let catBadge = item.categorie || '';
                let subBadge = item.subcategorie ? ` / ${item.subcategorie}` : '';
                let textCurat = item.produse || '';
                const numeAfisat = normalizeBlackMarketName(item.nume);
                const poateAdministra =
                    Number(currentUser.panel_level || 0) >= 99 ||
                    (typeof isPlatformAdmin === 'function' && isPlatformAdmin());
                const poateEdita =
                    poateAdministra ||
                    String(item.created_by_discord_id || '') === String(currentUser.discord_id || '');
                const poateSterge =
                    poateEdita;

                let imaginiHtml = '';
                let listaImaginiFinala = [];

                if (item.imagine_url && item.imagine_url.trim() !== '') {
                    listaImaginiFinala.push(item.imagine_url.trim());
                }

                try {
                    if (item.imagini_json) {
                        const parsed = JSON.parse(item.imagini_json);
                        if (Array.isArray(parsed)) {
                            parsed.forEach(img => {
                                if (!listaImaginiFinala.includes(img)) listaImaginiFinala.push(img);
                            });
                        }
                    }
                } catch(e) {}

                if (listaImaginiFinala.length > 0) {
                    imaginiHtml = '<div class="flex flex-wrap gap-2 mt-2 pt-2 border-t border-slate-800/60">';
                    listaImaginiFinala.forEach(imgUrl => {
                        const urlCurat = imgUrl.trim();
                        const sourcePrefix = (urlCurat.startsWith('data:image') || urlCurat.startsWith('http://') || urlCurat.startsWith('https://')) ? '' : 'img/';
                        imaginiHtml += `
                            <img src="${sourcePrefix}${urlCurat}" alt="Miniatură" class="rounded-lg h-10 w-10 object-cover border border-slate-700 cursor-pointer hover:opacity-90 transition" onclick="deschideModalImagine('${sourcePrefix}${urlCurat}')" title="Click pentru mărire">
                        `;
                    });
                    imaginiHtml += '</div>';
                }
                const organizatieText =
                    item.organization_illegal_name ||
                    item.organization_name ||
                    'Organizație ilegală';
                container.innerHTML += `
                    <div data-marketplace-id="${escapeHtml(item.id)}" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg flex flex-col justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="flex items-start justify-between">
                                <div>
                                    <span class="font-bold text-slate-100 text-sm">
                                            ${escapeHtml(numeAfisat)}
                                        </span>

                                        ${organizatieText ? `
                                        <div class="text-[10px] text-rose-400 mt-1">
                                        🏴 ${escapeHtml(organizatieText)}
                                        </div>
                                        ` : ''}
                                    <div class="text-xs text-slate-400 mt-0.5">Tel: ${escapeHtml(item.telefon || '')}</div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2 pt-1 flex-wrap gap-1">
                                <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${badgeClass}">${tipBadge}</span>
                                ${catBadge ? `<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20">${catBadge}${subBadge}</span>` : ''}
                            </div>
                            <div class="bg-slate-950/50 border border-slate-800 p-3 rounded-xl text-xs text-slate-300 whitespace-pre-line">${escapeHtml(textCurat)}</div>
                        </div>
                        <div class="space-y-2">
                            <div class="border-t border-slate-800 pt-3 flex items-center justify-between text-xs">
                                <div>
                                    ${item.pret ? `<div class="font-bold text-emerald-400 text-sm">${escapeHtml(item.pret)}</div>` : ''}
                                </div>
                                <div>
                                    ${dataFormatata ? `<div class="text-[10px] text-slate-500">Publicat: ${dataFormatata}</div>` : ''}
                                    ${poateEdita ? `<button type="button" onclick="editeazaAnuntMarketplace('${item.id}')" class="mt-2 px-2.5 py-1 rounded-lg border border-sky-500/30 bg-sky-500/10 text-sky-300 hover:bg-sky-500/20 text-[10px] font-bold">Editează</button>` : ''}
                                    ${poateSterge ? `<button type="button" onclick="stergeAnuntMarketplace('${item.id}')" class="mt-2 ml-1 px-2.5 py-1 rounded-lg border border-rose-500/30 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 text-[10px] font-bold">Șterge</button>` : ''}
                                </div>
                            </div>
                            ${imaginiHtml}
                        </div>
                    </div>
                `;
            }

            if (!marketplaceFocusHandled) {
                const focusId = new URLSearchParams(window.location.search).get('anunt');
                const focusedCard = focusId
                    ? container.querySelector(`[data-marketplace-id="${CSS.escape(focusId)}"]`)
                    : null;
                if (focusedCard) {
                    marketplaceFocusHandled = true;
                    focusedCard.classList.add('ring-2', 'ring-rose-400');
                    focusedCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        async function stergeAnuntMarketplace(id) {
            if (!confirm('Ștergi definitiv acest anunț?')) return;
            const token = localStorage.getItem('discord_access_token');
            const response = await fetch(`${SUPABASE_URL}/functions/v1/manage-community-posts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, authorization: `Bearer ${SUPABASE_KEY}` },
                body: JSON.stringify({ action: 'marketplace_delete', table: 'marketplace_ilegal', item_id: id, access_token: token })
            });
            const result = await response.json();
            if (!response.ok) return alert(result.error || 'Anunțul nu a putut fi șters.');
            await incarcaAnunturi();
        }

        function editeazaAnuntMarketplace(id) {
            const item = marketplaceItems.find(entry => String(entry.id) === String(id));
            if (!item) return;

            const poateAdministra =
                Number(currentUser.panel_level || 0) >= 99 ||
                (typeof isPlatformAdmin === 'function' && isPlatformAdmin());
            const poateEdita =
                poateAdministra ||
                String(item.created_by_discord_id || '') === String(currentUser.discord_id || '');
            if (!poateEdita) return;

            editingMarketplaceId = item.id;
            document.getElementById('nume').value = normalizeBlackMarketName(item.nume);
            document.getElementById('telefon').value = item.telefon || '';
            document.getElementById('tipAcțiune').value = item.tip_actiune || 'Vânzare';
            document.getElementById('categorie').value = item.categorie || '';
            document.getElementById('produse').value = item.produse || '';
            document.getElementById('pret').value = item.pret || '';
            document.getElementById('imagine_url_direct').value = item.imagine_url || '';
            document.getElementById('imagini_json').value = item.imagini_json || '[]';
            toggleTipActiune();
            toggleCategorie();
            toggleSubcategorie();
            document.getElementById('subcategorie').value = item.subcategorie || '';
            document.getElementById('marketSubmitBtn').textContent = 'Salvează modificările';
            document.getElementById('marketCancelEditBtn').classList.remove('hidden');
            document.getElementById('marketForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function anuleazaEditareMarketplace() {
            editingMarketplaceId = null;
            document.getElementById('marketForm').reset();
            document.getElementById('nume').value = normalizeBlackMarketName(currentUser.display_name || currentUser.username || '');
            document.getElementById('imagini_json').value = '[]';
            document.getElementById('marketSubmitBtn').textContent = 'Publică Anunțul';
            document.getElementById('marketCancelEditBtn').classList.add('hidden');
            toggleTipActiune();
            toggleCategorie();
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }

        async function trimitePeDiscord(anunt) {
            let pretText = anunt.pret ? anunt.pret : 'Negociabil / Nespecificat';
            let catText = anunt.categorie ? anunt.categorie : 'N/A';
            let subcatText = anunt.subcategorie ? ` / ${anunt.subcategorie}` : '';
            let organizatieText = currentUser.illegal_organization_name || 'Organizație ilegală';

            const fields = [
                { name: '👤 Nume', value: normalizeBlackMarketName(anunt.nume), inline: true },
                { name: '📞 Telefon', value: anunt.telefon, inline: true },
                { name: '📌 Tip Acțiune', value: anunt.tip_actiune, inline: true },
                { name: '📁 Categorie', value: catText + subcatText, inline: false },
                { name: '📦 Produse / Detalii', value: anunt.produse, inline: false },
                { name: '💰 Preț', value: pretText, inline: true },
                {
                name:'🏴 Organizație',
                value: organizatieText,
                inline:true
                },
            ];

            const formData = new FormData();
            let listaImaginiDiscord = [];

            try {
                let parsedImgs = JSON.parse(anunt.imagini_json || '[]');
                if (Array.isArray(parsedImgs)) {
                    listaImaginiDiscord = parsedImgs.filter(img => img && img.startsWith('data:image'));
                }
            } catch(e) {}

            listaImaginiDiscord.forEach((base64Data, index) => {
                const blob = dataURItoBlob(base64Data);
                const fileName = `imagine_${index + 1}.png`;
                formData.append(`files[${index}]`, blob, fileName);
            });

            const embedPrincipal = {
                title: '🚨 Anunț Nou - Black Market',
                url: anunt.id ? `${MARKETPLACE_PANEL_URL}?anunt=${encodeURIComponent(anunt.id)}` : MARKETPLACE_PANEL_URL,
                color: 15548997,
                fields: fields,
                footer: { text: 'Publicat prin Black Market - Panel by Little Mario' },
                timestamp: new Date().toISOString()
            };

            const payload = {
                embeds: [embedPrincipal],
                components: anunt.id ? [{
                    type: 1,
                    components: [{
                        type: 2,
                        style: 5,
                        label: 'Deschide anunțul în panel',
                        url: `${MARKETPLACE_PANEL_URL}?anunt=${encodeURIComponent(anunt.id)}`
                    }]
                }] : []
            };

            formData.append('payload_json', JSON.stringify(payload));

            try {
                const response = await sendPanelDiscord('illegal_marketplace', formData);

                if (!response.ok) {
                    const errText = await response.text();
                    console.error('Eroare Discord Webhook API:', response.status, errText);
                }
                return response;

            } catch (err) {
                console.error('Eroare la trimiterea pe Discord:', err);
                console.error('Mesaj eroare:', err?.message);
                console.error('Detalii complete:', JSON.stringify(err, null, 2));
            }
        }

        document.getElementById('marketForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const numeCuratat = normalizeBlackMarketName(document.getElementById('nume').value);
            if (!numeCuratat) {
                alert('Numele este obligatoriu și nu poate conține doar un identificator numeric.');
                return;
            }

            let pretValoare = document.getElementById('pret').value.trim();
            const tipSelectat = document.getElementById('tipAcțiune').value;

            if (pretValoare === '' && tipSelectat !== 'Cumpărare') {
                alert('Trebuie să completezi prețul sau să scrii "negociabil" pentru a putea publica anunțul!');
                return;
            }

            if (pretValoare !== '') {
                if (/^\d+$/.test(pretValoare)) {
                    let numar = parseInt(pretValoare, 10);
                    if (numar >= 10000) {
                        pretValoare = numar.toLocaleString('ro-RO');
                    }
                    pretValoare += '$';
                } else {
                    const contineLitere = /[a-zA-ZăâîșțĂÂÎȘȚ]/i.test(pretValoare);
                    if (!contineLitere && !pretValoare.includes('$')) {
                        pretValoare += '$';
                    }
                }
            } else {
                pretValoare = null;
            }

            const categorieSelectata = tipSelectat === 'Servicii' ? null : document.getElementById('categorie').value;
            const subcategorieSelectata = document.getElementById('containerSubcategorie').classList.contains('hidden') ? null : document.getElementById('subcategorie').value;

            const textProdus = document.getElementById('produse').value;
            const imaginiJsonValoare = document.getElementById('imagini_json').value;
            const imagineUrlDirectValoare = document.getElementById('imagine_url_direct').value.trim();

            const nouAnunt = {
                nume: numeCuratat,
                telefon: document.getElementById('telefon').value,
                tip_actiune: tipSelectat,
                categorie: categorieSelectata,
                subcategorie: subcategorieSelectata,
                produse: textProdus,
                pret: pretValoare,
                imagini_json: imaginiJsonValoare,
                imagine_url: imagineUrlDirectValoare !== '' ? imagineUrlDirectValoare : null,
                created_by_discord_id: currentUser.discord_id,
                // Anunțurile blackmarket sunt globale; accesul la pagină este controlat de rolurile organizației.
                organization_id: null
            };

            if (editingMarketplaceId) {
                const token = localStorage.getItem('discord_access_token');
                const response = await fetch(`${SUPABASE_URL}/functions/v1/manage-community-posts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, authorization: `Bearer ${SUPABASE_KEY}` },
                    body: JSON.stringify({
                        action: 'marketplace_update',
                        table: 'marketplace_ilegal',
                        item_id: editingMarketplaceId,
                        access_token: token,
                        ...nouAnunt
                    })
                });
                const result = await response.json();
                if (!response.ok) {
                    alert(result.error || 'Anunțul nu a putut fi modificat.');
                    return;
                }

                anuleazaEditareMarketplace();
                await incarcaAnunturi();
                alert('Anunțul a fost modificat cu succes.');
                return;
            }

            const { data: savedAnunt, error } = await supabaseClient
                .from('marketplace_ilegal')
                .insert([nouAnunt])
                .select('id')
                .single();

            if (error) {
                alert('Erore la salvare: ' + error.message);
            } else {
                const discordResponse = await trimitePeDiscord({ ...nouAnunt, id: savedAnunt.id });
                if (discordResponse?.ok) {
                    const discordResult = await discordResponse.json();
                    await supabaseClient.from('marketplace_ilegal').update({ discord_message_ids: discordResult.messages || [] }).eq('id', savedAnunt.id);
                }

                alert('Anunț publicat cu succes!');
                document.getElementById('marketForm').reset();
                document.getElementById('nume').value = normalizeBlackMarketName(currentUser.display_name || currentUser.username || '');

                imaginiCurente = [];
                actualizeazaPrevizualizariImagini();

                document.getElementById('categorie').selectedIndex = 0;
                toggleTipActiune();
                toggleCategorie();
                incarcaAnunturi();
            }
        });

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
    <script src="js/discord-notifications.js"></script>
    <script src="js/global-footer.js"></script>
