<!doctype html><html lang="ro" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vouchere · Panel</title><link rel="stylesheet" href="css/tailwind.css"><script src="js/supabase-config.js?v=20260820-session-date-fix"></script><script src="js/permissions.js?v=4.6.0"></script><script src="js/panel-layout.js?v=4.26.0"></script><link rel="stylesheet" href="css/global-footer.css"></head><body class="bg-slate-950 text-slate-100 min-h-screen"><main class="max-w-5xl mx-auto p-6"><section class="rounded-2xl border border-fuchsia-700/50 bg-slate-900 p-6"><h1 class="text-2xl font-black">Vouchere organizații</h1><p class="mt-2 text-sm text-slate-400">Generează coduri pentru evenimente, promoții sau activări temporare. Fiecare cod este unic și poate fi folosit o singură dată.</p><div class="mt-6 grid gap-4 md:grid-cols-3"><label class="text-sm">Pachet<select id="package" class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 p-3"><option value="standard">Standard</option><option value="full">Full</option></select></label><label class="text-sm">Număr vouchere<input id="count" type="number" min="1" max="100" value="1" class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 p-3"></label><label class="text-sm">Valabilitate<select id="duration" class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 p-3"><option value="1">1 zi</option><option value="3">3 zile</option><option value="7">1 săptămână</option><option value="14">2 săptămâni</option><option value="30" selected>1 lună</option><option value="60">2 luni</option><option value="90">3 luni</option><option value="180">6 luni</option><option value="365">1 an</option></select></label></div><button id="generate" class="mt-5 rounded-xl bg-fuchsia-700 px-5 py-3 font-bold">Generează vouchere</button><textarea id="output" readonly class="mt-4 min-h-40 w-full rounded-xl bg-slate-950 border border-slate-700 p-3 font-mono text-sm" placeholder="Codurile generate vor apărea aici"></textarea><p id="status" class="mt-3 text-sm text-slate-400"></p></section></main><script>const $=id=>document.getElementById(id);$('generate').onclick=async()=>{try{const c=window.PANEL_SUPABASE_CONFIG,t=localStorage.getItem('panel_session_token');const r=await fetch(`${c.url}/functions/v1/manage-organizations`,{method:'POST',headers:{'Content-Type':'application/json',apikey:c.publishableKey,Authorization:`Bearer ${c.publishableKey}`,'x-panel-session':t},body:JSON.stringify({action:'generate_vouchers',package_code:$('package').value,count:$('count').value,duration_days:$('duration').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Generarea a eșuat.');$('output').value=(j.vouchers||[]).map(v=>v.code).join('\n');$('status').textContent=`Au fost generate ${(j.vouchers||[]).length} coduri.`}catch(e){$('status').textContent=e.message}};</script><script src="js/global-footer.js"></script></body></html>
