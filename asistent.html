<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistent Intern - Panel</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="js/supabase-config.js?v=20260820-session-date-fix"></script>
    <script src="js/permissions.js?v=4.6.2"></script>
    <script src="js/panel-layout.js?v=4.28.9"></script>
    <link rel="stylesheet" href="css/global-footer.css">
    <script src="js/project-version.js?v=3.11.5"></script>
    <link rel="icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/logo-180.png">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen text-sm overflow-hidden">
    <div class="flex h-screen w-full overflow-hidden">

            <div class="flex-1 min-h-0 p-3 sm:p-5 md:p-8">
        

        <main class="flex-1 flex flex-col min-w-0 min-h-0 overflow-hidden">
            
                <section class="h-full max-w-5xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-xl flex flex-col overflow-hidden">
                    <div class="px-4 sm:px-5 py-3 border-b border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div><p class="text-sm font-semibold text-slate-200">Întreabă despre panel</p><p id="assistant-index-status" class="text-[10px] text-slate-500">Se pregătesc informațiile locale…</p></div>
                        <button id="assistant-clear" type="button" class="self-start sm:self-auto rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-slate-400 hover:text-white">Curăță conversația</button>
                    </div>

                    <div id="assistant-messages" class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6 space-y-4" aria-live="polite"></div>

                    <div class="border-t border-slate-800 bg-slate-950/45 p-3 sm:p-4 space-y-3">
                        <div id="assistant-suggestions" class="flex gap-2 overflow-x-auto pb-1"></div>
                        <form id="assistant-form" class="flex items-end gap-2">
                            <label class="sr-only" for="assistant-input">Scrie întrebarea</label>
                            <textarea id="assistant-input" rows="1" maxlength="500" required placeholder="Ex: Cum pornesc pontajul?" class="flex-1 max-h-32 resize-none rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none focus:border-emerald-500"></textarea>
                            <button type="submit" class="h-11 px-4 sm:px-5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow">Trimite</button>
                        </form>
                        <p class="text-[10px] text-slate-600">Asistentul folosește numai conținutul local permis rolului tău și poate spune când nu găsește informația.</p>
                    </div>
                </section>

                <section id="assistant-feedback-admin" hidden class="mt-4 max-w-5xl mx-auto rounded-2xl border border-amber-500/20 bg-slate-900 shadow-xl">
                    <div class="flex flex-col gap-3 border-b border-slate-800 px-4 py-3 sm:flex-row sm:items-center sm:justify-between">
                        <div>
                            <p class="text-sm font-semibold text-slate-200">Feedback roboțel</p>
                            <p id="assistant-feedback-summary" class="text-[10px] text-slate-500">Doar pentru administratori</p>
                        </div>
                        <button id="assistant-feedback-refresh" type="button" class="rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-slate-300 hover:text-white">Actualizează</button>
                    </div>
                    <div id="assistant-feedback-list" class="max-h-96 space-y-2 overflow-y-auto p-4">
                        <p class="text-xs text-slate-500">Se încarcă feedback-ul…</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/craft-mechanic-recipes.js?v=4.9.0"></script>
    <script src="js/asistent-data.js?v=4.9.0"></script>
    <script src="js/asistent-calculator-data.js?v=4.9.0"></script>
    <script src="js/asistent-core.js?v=4.9.2"></script>
    <script src="js/asistent.js?v=4.9.2"></script>
    <script src="js/global-footer.js"></script>
</body>
</html>
