<!doctype html>
<html lang="ro" class="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Propuneri</title>
  <link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/anunturi.css"><link rel="stylesheet" href="css/global-footer.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
  <script src="js/supabase-config.js?v=20260820-session-date-fix"></script><script src="js/permissions.js?v=4.6.2"></script><script src="js/panel-layout.js?v=4.28.10"></script>
  <link rel="icon" href="img/favicon.ico">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex text-sm">
<main class="flex-1 flex flex-col min-w-0 min-h-screen"><section class="community-shell flex-1" id="community-feed-shell">
  <div class="community-hero"><div><h2>💡 Propuneri</h2><p>Idei trimise de Organizație sau Angajați, cu voturi și status urmărit separat.</p></div><button id="create-button" class="btn" hidden>+ Creează propunere</button></div>
  <div class="tabs"><button class="tab active" data-filter="proposal">Toate propunerile</button></div>
  <div id="feed" class="feed"><div class="empty">Se încarcă…</div></div>
</section><div data-panel-footer-host class="w-full mt-auto"></div></main>
<div id="post-modal" class="modal" hidden><section class="dialog"><h3 id="form-heading">Creează propunere</h3><form id="post-form" class="form"><select id="post-type" hidden><option value="proposal">Propunere</option></select><label>Titlu<input id="post-title" maxlength="140" required></label><label>Descriere<textarea id="post-content" maxlength="4000" required></textarea></label><div id="poll-wrap" hidden></div><div class="dialog-actions"><button type="button" data-close class="btn secondary">Renunță</button><button class="btn">Continuă</button></div></form></section></div>
<div id="audience-modal" class="modal" hidden><section class="dialog"><h3>Unde trimiți propunerea?</h3><p class="muted">Alege Organizație sau Angajați / Birouri.</p><div class="audiences"><button data-audience="organization" class="audience">👥<br>Organizație</button><button data-audience="departments" class="audience">🔧<br>Angajați / Birouri</button></div></section></div>
<div id="unified-create-modal" class="modal" hidden><form id="unified-create-form"><select id="unified-create-type"><option value="proposal">Propunere</option></select></form></div>
<script src="js/anunturi.js?v=20261009-proposals-separate"></script><script src="js/anunturi-hub.js?v=20261009-proposals-separate"></script><script src="js/global-footer.js"></script>
</body></html>
