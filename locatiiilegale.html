            if (isCocaine) {
                return {
                    href: 'calculatorilegal.html#cat-plicuri',
                    title: 'Calculator pentru CocainÄƒ',
                    description: 'CalculeazÄƒ resursele necesare pentru producÈ›ia de cocainÄƒ.',
                    buttonText: 'Deschide Calculatorul de CocainÄƒ'
                };
            }

            if (isCannabis) {
                return {
                    href: 'calculatorilegal.html#cat-weed',
                    title: 'Calculator pentru Canabis',
                    description: 'CalculeazÄƒ resursele necesare pentru procesarea canabisului.',
                    buttonText: 'Deschide Calculatorul de Canabis'
                };
            }

            return null;
        }

        function selectLocation(id, zoomTo = true) {
            const loc = DATA.find(item => item.id === id);
            if (!loc) return;

            currentSelectedLocation = loc;
            state.selectedLocationId = id;

            if (loc.map !== state.currentMap) switchMap(loc.map, false);

            if (zoomTo) {
                const mapCfg = CONFIG.maps[loc.map];
                maps[loc.map].setView([mapCfg.height - (loc.y / 100) * mapCfg.height, (loc.x / 100) * mapCfg.width], 0, { animate: true });
            }

            const catInfo = CONFIG.categories[loc.category];
            document.getElementById('sb-category').textContent = catInfo ? catInfo.name : loc.category;
            document.getElementById('sb-category').style.color = catInfo ? catInfo.color : 'var(--danger)';
            document.getElementById('sb-title').textContent = loc.title;
            document.getElementById('sb-description').textContent = loc.description;
            document.getElementById('sb-requirements').textContent = loc.requirements || 'Niciuna';
            document.getElementById('sb-rewards').textContent = loc.rewards || 'Standard';
            document.getElementById('sb-notes').textContent = loc.notes || 'FÄƒrÄƒ note.';
            document.getElementById('sb-updated').textContent = `Modificat: ${loc.lastUpdated || '2026-07-26'}`;

            const galleryContainer = document.getElementById('sb-gallery-container');
            const images = (loc.images && loc.images.length > 0) ? loc.images : ['image_6d67a5.jpg'];

            let galleryHTML = '';
            images.forEach((img, idx) => {
                galleryHTML += `<img src="${resolveLocationImage(img)}" class="gallery-slide ${idx === 0 ? 'active' : ''}" alt="Imagine locaÈ›ie" onerror="this.classList.add('image-load-error'); this.alt='Imagine indisponibilÄƒ';">`;
            });

            if (images.length > 1) {
                galleryHTML += `
                    <div class="gallery-nav gallery-prev" onclick="event.stopPropagation(); changeSlide(-1)">â®</div>
                    <div class="gallery-nav gallery-next" onclick="event.stopPropagation(); changeSlide(1)">â¯</div>
                `;
            }
            galleryHTML += `<div class="gallery-counter" id="sb-gallery-counter">1 / ${images.length}</div>`;
            galleryContainer.innerHTML = galleryHTML;
            activeGalleryIndex = 0;

            const isFav = state.favorites.includes(loc.id);
            const favBtn = document.getElementById('sb-favorite-btn');
            favBtn.textContent = isFav ? 'â­' : 'â˜†';
            favBtn.style.color = isFav ? '#f59e0b' : 'inherit';

            if (isAdminLoggedIn) document.getElementById('sb-edit-panel-btn').style.display = 'flex';

            const recipeWrapper = document.getElementById('sb-recipe-wrapper');
            const calculatorContext = getCalculatorContext(loc);

            if (calculatorContext) {
                document.getElementById('sb-recipe-custom-title').textContent = calculatorContext.title;
                document.getElementById('sb-recipe-custom-desc').textContent = calculatorContext.description;
                document.getElementById('sb-recipe-text').textContent = calculatorContext.buttonText;
                document.getElementById('sb-recipe-link').href = calculatorContext.href;
                recipeWrapper.classList.add('active');
            } else {
                recipeWrapper.classList.remove('active');
            }

            document.getElementById('sidebar').classList.add('open');
        }

        function resolveLocationImage(value) {
            const source = String(value || '').trim().replace(/\\/g, '/');
            if (!source) return 'img/image_6d67a5.jpg';
            if (/^(?:https?:|data:|blob:)/i.test(source)) return source;
            if (source.startsWith('/')) return source;
            return source.startsWith('img/') ? source : `img/${source}`;
        }

        function changeSlide(direction) {
            if (!currentSelectedLocation || !currentSelectedLocation.images) return;
            const images = currentSelectedLocation.images;
            if (images.length <= 1) return;

            activeGalleryIndex = (activeGalleryIndex + direction + images.length) % images.length;
            const container = document.getElementById('sb-gallery-container');
            const slides = container.querySelectorAll('.gallery-slide');
            slides.forEach((slide, idx) => {
                slide.classList.toggle('active', idx === activeGalleryIndex);
            });
            const counter = document.getElementById('sb-gallery-counter');
            if (counter) counter.textContent = `${activeGalleryIndex + 1} / ${images.length}`;
        }

        function openLightboxFromSidebar() {
            if (!currentSelectedLocation || !currentSelectedLocation.images) return;
            const images = currentSelectedLocation.images;
            const currentImgSrc = images[activeGalleryIndex] || images[0];
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = resolveLocationImage(currentImgSrc);
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        function switchMap(targetMapId, updateView = true) {
            if (state.currentMap === targetMapId && updateView) return;
            document.getElementById(`map-${state.currentMap}-view`).classList.remove('active');
            setTimeout(() => {
                document.getElementById(`map-${targetMapId}-view`).classList.add('active');
                state.currentMap = targetMapId;
                if (updateView) {
                    setTimeout(() => maps[targetMapId].invalidateSize(), 50);
                }
                ['ls', 'cayo', 'maldive'].forEach(m => {
                    document.querySelectorAll(`[data-map-target="${m}"]`).forEach(button => button.classList.toggle('active', m === targetMapId));
                });
                localStorage.setItem('gta_guide_illegal_map', targetMapId);
            }, 300);
        }

        function setupSearch() {
            const searchInput = document.getElementById('search-input');
            const resultsBox = document.getElementById('search-results');

            // Header-ul global poate sÄƒ nu conÈ›inÄƒ cÄƒutarea localÄƒ.
            // ÃŽn acest caz nu avem nimic de iniÈ›ializat.
            if (!searchInput || !resultsBox) {
                console.log(
                    '[LocaÈ›ii Ilegale] CÄƒutarea localÄƒ nu existÄƒ Ã®n header-ul global.'
                );
                return;
            }

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value
                    .toLowerCase()
                    .trim();

                if (!query) {
                    resultsBox.style.display = 'none';
                    return;
                }

                const matches = DATA.filter(item =>
                    item.title.toLowerCase().includes(query) ||
                    item.description.toLowerCase().includes(query)
                );

                if (matches.length === 0) {
                    resultsBox.innerHTML =
                        `<div class="search-result-item">
                            Nicio locaÈ›ie gÄƒsitÄƒ
                        </div>`;

                    resultsBox.style.display = 'block';
                    return;
                }

                resultsBox.innerHTML = '';

                matches.forEach(match => {
                    const div = document.createElement('div');

                    div.className = 'search-result-item';

                    div.innerHTML = `
                        <span>${match.title}</span>
                        <span style="
                            font-size:11px;
                            color:var(--text-muted);
                        ">
                            ${match.map.toUpperCase()}
                        </span>
                    `;

                    div.addEventListener('click', () => {
                        selectLocation(match.id);

                        resultsBox.style.display = 'none';
                        searchInput.value = '';
                    });

                    resultsBox.appendChild(div);
                });

                resultsBox.style.display = 'block';
            });
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function setupEventListeners() {
            document.getElementById('sb-close-btn').addEventListener('click', () => document.getElementById('sidebar').classList.remove('open'));
            document.getElementById('sb-favorite-btn').addEventListener('click', () => {
                if (!currentSelectedLocation) return;
                const id = currentSelectedLocation.id;
                const idx = state.favorites.indexOf(id);
                if (idx > -1) {
                    state.favorites.splice(idx, 1);
                    showToast('Eliminat din favorite');
                } else {
                    state.favorites.push(id);
                    showToast('AdÄƒugat la favorite');
                }
                localStorage.setItem('gta_guide_illegal_fav', JSON.stringify(state.favorites));
                updateFavoritesCounter();
                selectLocation(id, false);
            });

            document.getElementById('sb-copy-btn').addEventListener('click', () => {
                if (!currentSelectedLocation) return;
                const loc = currentSelectedLocation;
                const textToCopy = `[${loc.title}] - HartÄƒ: ${loc.map.toUpperCase()} | Descriere: ${loc.description} | CerinÈ›e: ${loc.requirements} | Recompense: ${loc.rewards}`;
                navigator.clipboard.writeText(textToCopy);
                showToast('InformaÈ›iile au fost copiate!');
            });

            setupSearch();
        }

        window.addEventListener('DOMContentLoaded', async () => {

            // Stabilim drepturile folosind sistemul central din permissions.js.
            actualizeazaAccesAdministratorLocatii();

            // Profilul utilizatorului.
            fetchUserData();

            try {

                // 1. ÃŽncÄƒrcÄƒm starea actualÄƒ din baza de date.
                await loadLocationsFromDatabase();

            } catch (error) {

                console.error(
                    'Eroare la Ã®ncÄƒrcarea locaÈ›iilor:',
                    error
                );

                alert(
                    'LocaÈ›iile nu au putut fi Ã®ncÄƒrcate din baza de date.'
                );
            }

            // 2. Construim hÄƒrÈ›ile È™i markerele.
            initMaps();

            // 3. Pornim sincronizarea live cu Supabase.
            subscribeToIllegalLocationsRealtime();

            // AplicÄƒm din nou drepturile dupÄƒ construirea interfeÈ›ei.
            actualizeazaAccesAdministratorLocatii();
        });
    </script>
