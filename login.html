    50%{

    }

    100%{

</head>
<body class="min-h-screen overflow-x-hidden bg-slate-950 text-slate-100 font-sans antialiased relative flex flex-col">
    <!-- Fundal -->
    <div class="absolute inset-0 overflow-hidden -z-10">

        <div class="bgblob absolute -top-40 -left-40 w-96 h-96 rounded-full bg-indigo-600/20 blur-3xl"></div>

        <div class="bgblob absolute top-1/2 -right-32 w-[30rem] h-[30rem] rounded-full bg-cyan-500/10 blur-3xl"></div>

        <div class="bgblob absolute bottom-0 left-1/3 w-[28rem] h-[28rem] rounded-full bg-violet-500/10 blur-3xl"></div>

    </div>

    <div class="relative min-h-[calc(100vh-96px)] flex items-center justify-center p-6 flex-1">
    <!-- Card de Autentificare -->
    <div class="login-card w-full max-w-lg rounded-3xl border border-slate-700/60 bg-slate-900/70 backdrop-blur-xl shadow-[0_0_60px_rgba(59,130,246,0.15)] p-10 text-center space-y-8">
    <div class="space-y-3">

    <div class="inline-flex flex-col items-center gap-3">

        <img src="img/logo-192.png" alt="Logo Panel" class="w-24 h-24 rounded-3xl border border-indigo-400/30 object-cover shadow-lg shadow-indigo-500/20">

        <span class="rounded-full border border-indigo-400/20 bg-indigo-500/10 px-4 py-1 text-xs font-semibold uppercase tracking-[0.25em] text-indigo-300">
            Secure Access
        </span>

    </div>

        <h1 class="text-4xl font-black tracking-tight bg-gradient-to-r from-white via-indigo-200 to-cyan-300 bg-clip-text text-transparent">
            Platformă organizații
        </h1>

        <p class="text-sm uppercase tracking-[0.35em] text-slate-500">
            Autentificare multi-organizație
        </p>

        <p class="text-slate-400 leading-relaxed max-w-sm mx-auto">
            Un singur cont Discord. Organizația, rolul și paginile permise sunt detectate automat la autentificare.
        </p>

    </div>

        <div class="mb-3 space-y-2"><label for="voucher-code" class="block text-xs text-slate-400">Voucher (opțional)</label><input id="voucher-code" type="text" maxlength="64" placeholder="Ex: FULL-ABC123" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100"><label for="voucher-guild-id" class="block text-xs text-slate-400">Guild ID pentru voucher</label><input id="voucher-guild-id" type="text" inputmode="numeric" maxlength="22" placeholder="ID-ul serverului Discord ales de tine" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100"></div>
        <!-- Butonul de Login Discord -->
        <button
            id="discord-login-btn"
            class="group w-full rounded-2xl border border-indigo-400/20 bg-gradient-to-r from-[#5865F2] to-[#4752C4] px-6 py-5 transition-all duration-500 hover:-translate-y-1 hover:scale-[1.015] hover:shadow-[0_12px_40px_rgba(88,101,242,0.45)] active:translate-y-0 active:scale-[0.985]">

            <div class="flex items-center justify-between">

                <div class="flex items-center gap-4">

                    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-white/10">
                        <svg class="w-6 h-6 fill-current text-white" viewBox="0 0 24 24">
                            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028z"/>
                        </svg>
                    </div>

                    <div class="text-left">
                        <div class="text-lg font-bold text-white">
                            Discord
                        </div>

                        <div class="text-sm text-indigo-100">
                            Conectare securizată OAuth2
                        </div>
                    </div>

                </div>

                <div class="text-2xl text-white transition-all duration-500 group-hover:translate-x-2 group-hover:scale-110">
                    →
                </div>

            </div>

        </button>

    <div class="space-y-5">

        <div class="rounded-2xl border border-slate-700/40 bg-slate-800/40 p-4">

            <div class="flex flex-wrap items-center justify-center gap-4 text-sm">

                <div class="flex items-center gap-2 text-emerald-400">
                    <span>✓</span>
                    <span class="text-slate-300">OAuth2</span>
                </div>

                <div class="w-px h-4 bg-slate-700"></div>

                <div class="flex items-center gap-2 text-cyan-400">
                    <span>🛡️</span>
                    <span class="text-slate-300">Rol sincronizat</span>
                </div>

                <div class="w-px h-4 bg-slate-700"></div>

                <div class="flex items-center gap-2 text-violet-400">
                    <span>⚡</span>
                    <span class="text-slate-300">Permisiuni live</span>
                </div>

            </div>

        </div>

        <p
            id="status-msg"
            class="min-h-[24px] text-sm font-medium text-indigo-300 transition-all duration-300">
        </p>

    </div>
    </div>
    </div>
    <div data-panel-footer-host class="relative z-10 w-full"></div>
    <!-- Script de Autentificare și Sincronizare Supabase -->
    <script>
        const SUPABASE_URL = window.PANEL_SUPABASE_CONFIG.url;
        const SUPABASE_KEY = window.PANEL_SUPABASE_CONFIG.publishableKey;
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('voucher-code')?.closest('div')?.remove();
        const loginInfo = document.createElement('details');
        loginInfo.className = 'rounded-2xl border border-cyan-500/20 bg-cyan-500/5 p-4 text-left';
        loginInfo.innerHTML = '<summary class="cursor-pointer text-sm font-bold text-cyan-200">Cum funcționează accesul?</summary><div class="mt-3 space-y-2 text-xs leading-5 text-slate-300"><p>Te conectezi cu Discord, iar panelul verifică automat organizația și rolurile tale.</p><p>Dacă nu ai încă o organizație, vei primi o pagină separată unde verifici voucherul și începi configurarea.</p><p>Guild ID-ul se adaugă după verificarea voucherului, în pasul de configurare al organizației.</p></div>';
        document.getElementById('discord-login-btn')?.before(loginInfo);

        let CLIENT_ID = window.PANEL_DISCORD_CONFIG.clientId;
        const DISCORD_SCOPES = window.PANEL_DISCORD_CONFIG.scopes.join(' ');
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        function getLoginDestination(user) {
            if (user?.organization_access_expired === true) {
                return 'administrare-organizatie.html';
            }
            const selectedPages = Array.isArray(user?.allowed_pages) && user.allowed_pages.length > 0;
            const platformAdmin = user?.platform_admin === true || user?.is_platform_admin === true;
            if (!platformAdmin && !selectedPages) {
                return 'guest.html';
            }

            return 'index.html';
        }

        function getSafeReturnDestination(user) {
            const fallback = getLoginDestination(user);
            if (user?.organization_access_expired === true) {
                return 'administrare-organizatie.html';
            }
            const savedDestination = sessionStorage.getItem('panel_return_after_login');
            sessionStorage.removeItem('panel_return_after_login');
            if (!savedDestination) return fallback;

            try {
                const destination = new URL(savedDestination, window.location.href);
                if (destination.origin !== window.location.origin) return fallback;
                const page = destination.pathname.split('/').pop() || 'index.html';
                const selectedPages = Array.isArray(user?.allowed_pages) && user.allowed_pages.includes(page);
                const platformAdmin = user?.platform_admin === true || user?.is_platform_admin === true;
                if (!platformAdmin && !selectedPages) return fallback;
                return `${page}${destination.search}${destination.hash}`;
            } catch (_) {
                return fallback;
            }
        }

        document.getElementById('discord-login-btn').addEventListener('click', async () => {
            try {
                const { data } = await supabaseClient.rpc('get_discord_oauth_config');
                // Client ID-ul local este sursa sigura pentru autentificare.
                // O valoare veche dintr-o migrare nu poate suprascrie aplicatia activa.
                void data;
            } catch (_) {
                // Configurația locală rămâne fallback pentru prima instalare.
            }
            const oauthState = crypto.randomUUID();
            sessionStorage.setItem('discord_oauth_state', oauthState);

            const authParams = new URLSearchParams({
                client_id: CLIENT_ID,
                redirect_uri: REDIRECT_URI,
                response_type: 'token',
                scope: DISCORD_SCOPES,
                state: oauthState
            });

            window.location.href = `https://discord.com/oauth2/authorize?${authParams.toString()}`;
        });

document.addEventListener('DOMContentLoaded', async () => {

    const hash = window.location.hash;
    // Discord OAuth Implicit Flow returneaza tokenul in fragmentul URL.
    if (hash && hash.includes('access_token')) {

        const params = new URLSearchParams(hash.substring(1));
        const accessToken = params.get('access_token');
        const returnedState = params.get('state');
        const expectedState = sessionStorage.getItem('discord_oauth_state');

        if(accessToken){
            if (returnedState === 'panel_android') {
                window.location.replace(`discord-1531023771211792384:/authorize/callback#${params.toString()}`);
                return;
            }
            window.history.replaceState({}, document.title, window.location.pathname);
            sessionStorage.removeItem('discord_oauth_state');

            if (!expectedState || returnedState !== expectedState) {
                setLoginStatus("Eroare autentificare: raspuns OAuth invalid.");
                return;
            }
            setLoginStatus("🔄 Se inițiază autentificarea...");
            await processDiscordLogin(accessToken);
            return;
        }

    }


    // Varianta nouă Discord Code Flow
    // Authorization Code Flow is intentionally not used by this static page.
    // The configured login always requests response_type=token.
    const code = null;

    if(code){

        console.log("CODE DISCORD PRIMIT:", code);

        setLoginStatus("🔄 Cod Discord primit. Se verifică...");

        // momentan doar verificăm că ajunge aici
        return;

    }


    // sesiune existentă
    const existingUser = localStorage.getItem('discord_user');

    if(existingUser){

        try {

            const parsed = JSON.parse(existingUser);

            const panelSession = localStorage.getItem('panel_session_token');
            const expiresAt = new Date(localStorage.getItem('panel_session_expires_at') || 0).getTime();
            if(parsed && parsed.discord_id && panelSession && expiresAt > Date.now()){
                window.location.href = getLoginDestination(parsed);
                return;
            }
            localStorage.clear();

        } catch(error){

            console.error(error);
            localStorage.clear();

        }

    }

});
        function setLoginStatus(message) {
            const status = document.getElementById("status-msg");

            status.style.opacity = 0;

            setTimeout(() => {
                status.textContent = message;
                status.style.opacity = 1;
            }, 150);
        }
        async function processDiscordLogin(token) {
            try {
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Eșec la preluarea profilului de pe Discord.');
                const discordData = await response.json();

                if (!discordData.id) {
                    throw new Error('Profil Discord invalid.');
                }

                setLoginStatus("🛡️ Se verifică rolul pe server...");

                const syncResponse = await fetch(`${SUPABASE_URL}/functions/v1/sync-discord-role`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        apikey: SUPABASE_KEY,
                        authorization: `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ access_token: token })
                });
                const syncResult = await syncResponse.json();
                if (!syncResponse.ok || !syncResult.user) {
                    if (['NO_ORGANIZATION', 'ROLE_NOT_CONFIGURED'].includes(String(syncResult.code || ''))) {
                        localStorage.setItem('discord_access_token', token);
                        localStorage.setItem('discord_user', JSON.stringify({ discord_id: discordData.id, username: discordData.username, display_name: discordData.global_name || discordData.username, avatar: discordData.avatar }));
                        sessionStorage.removeItem('panel_onboarding_voucher');
                        window.location.href = 'organizatie-bun-venit.html';
                        return;
                    }
                    throw new Error(syncResult.error || 'Rolul Discord nu a putut fi verificat.');
                }

                const syncedUser = syncResult.user;
                localStorage.setItem('discord_user', JSON.stringify(syncedUser));
                localStorage.setItem('user_role', syncedUser.role);
                localStorage.setItem('discord_access_token', token);
                localStorage.setItem('panel_session_token', syncResult.session_token);
                localStorage.setItem('panel_session_expires_at', syncResult.expires_at);
                localStorage.setItem('panel_active_organization', JSON.stringify(syncResult.active_organization));
                localStorage.setItem('panel_organizations', JSON.stringify(syncResult.organizations || []));
                localStorage.setItem('panel_role_synced_at', String(Date.now()));

                setLoginStatus(`✅ ${syncResult.active_organization?.name || 'Organizație'} · ${syncedUser.role}`);

                setTimeout(() => {
                    window.location.href = getSafeReturnDestination(syncedUser);
                }, 400);

                return;


            } catch (err) {
                console.error('Erore login:', err);
                document.getElementById('status-msg').textContent = `Eroare autentificare: ${err.message || 'eroare necunoscută'}`;
                localStorage.clear();
            }
        }
    </script>
    <script src="js/global-footer.js"></script>
</body>
</html>
