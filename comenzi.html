<!doctype html>
<html lang="ro" class="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Comenzi ilegale</title>
  <link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/global-footer.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" crossorigin="anonymous"></script>
  <script src="js/supabase-config.js?v=20260820-session-date-fix"></script>
  <script src="js/permissions.js?v=4.6.2"></script><script src="js/panel-layout.js?v=4.28.10"></script>
  <link rel="icon" href="img/favicon.ico">
  <style>
    .orders-shell{width:100%;max-width:1180px;margin:0 auto;padding:28px 32px 44px}.orders-hero,.orders-card{border:1px solid #24334d;border-radius:16px;background:rgba(15,23,42,.78);box-shadow:0 12px 36px rgba(2,6,23,.18)}.orders-hero{padding:22px;margin-bottom:18px}.orders-hero h1{font-size:clamp(1.35rem,2vw,1.8rem);font-weight:800;color:#f8fafc}.orders-hero p{margin-top:6px;color:#94a3b8;font-size:13px}.orders-grid{display:grid;grid-template-columns:minmax(300px,.75fr) minmax(0,1.25fr);gap:18px}.orders-card{padding:18px}.orders-card h2{font-size:15px;font-weight:800;color:#e2e8f0}.orders-muted{color:#94a3b8;font-size:12px}.orders-form{display:grid;gap:12px;margin-top:16px}.orders-form label{display:grid;gap:6px;color:#cbd5e1;font-size:12px;font-weight:700}.orders-form input,.orders-form select,.orders-form textarea{width:100%;border:1px solid #334155;border-radius:9px;background:#07101f;color:#e2e8f0;padding:10px 11px;outline:none}.orders-form textarea{min-height:92px;resize:vertical}.orders-form input:focus,.orders-form select:focus,.orders-form textarea:focus{border-color:#f59e0b}.orders-btn{border:1px solid #334155;border-radius:10px;background:#0f1b31;color:#dbeafe;padding:9px 13px;font-size:12px;font-weight:800;cursor:pointer}.orders-btn.primary{border-color:#b45309;background:#92400e;color:#ffedd5}.orders-btn.success{border-color:#047857;background:#065f46;color:#d1fae5}.orders-btn.danger{border-color:#991b1b;background:#450a0a;color:#fecaca}.orders-notice{margin-bottom:16px;border:1px solid #7c2d12;border-radius:12px;background:#431407;color:#fed7aa;padding:12px;font-size:12px}.orders-list{display:grid;gap:10px;margin-top:14px}.order-row{border:1px solid #263650;border-radius:13px;padding:14px;background:#0b1424}.order-head{display:flex;justify-content:space-between;gap:12px}.order-title{font-weight:800;color:#f8fafc}.order-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.order-pill{border:1px solid #334155;border-radius:999px;padding:3px 8px;color:#bfdbfe;font-size:11px}.order-pill.pending{border-color:#92400e;color:#fde68a;background:#451a03}.order-pill.approved{border-color:#166534;color:#bbf7d0;background:#052e16}.order-pill.rejected{border-color:#991b1b;color:#fecaca;background:#450a0a}.order-note{margin-top:9px;color:#cbd5e1;font-size:12px;line-height:1.5;white-space:pre-wrap}.order-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.order-empty{border:1px dashed #334155;border-radius:12px;padding:22px;text-align:center;color:#94a3b8;font-size:12px}@media(max-width:850px){.orders-grid{grid-template-columns:1fr}.orders-shell{padding:22px 16px 36px}.order-head{display:block}}
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex text-sm"><main class="flex-1 min-w-0 min-h-screen"><section class="orders-shell">
  <header class="orders-hero"><div><h1>📦 Comenzi</h1><p>Înregistrează comenzi pe categorii și urmărește aprobarea lor. Numele solicitantului este preluat automat din contul Discord.</p></div></header>
  <div id="orders-notice" class="orders-notice" hidden></div>
  <div class="orders-grid"><section class="orders-card"><h2>Comandă nouă</h2><p class="orders-muted">Completează tipul, articolul și cantitatea dorită.</p><form id="orders-form" class="orders-form"><label>Solicitat de<div id="orders-actor" class="rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-slate-300">Se încarcă…</div></label><label>Tip comandă<select id="order-type" required></select></label><label>Gloante / arme / model / semințe etc.<input id="order-item" maxlength="160" required placeholder="Ex: 100 gloanțe 9mm"></label><label>Cantitate<input id="order-quantity" type="number" min="0.01" step="0.01" required value="1"></label><label>Detalii / observații<textarea id="order-notes" maxlength="4000" placeholder="Detalii opționale pentru aprobator"></textarea></label><button class="orders-btn primary" type="submit">Trimite comanda</button></form></section>
  <section class="orders-card"><h2>Jurnal comenzi</h2><p class="orders-muted">Aici apar comenzile trimise și statusul aprobării.</p><div id="orders-list" class="orders-list"><div class="order-empty">Se încarcă…</div></div></section></div>
</section><div data-panel-footer-host class="w-full mt-auto"></div></main><script src="js/global-footer.js"></script><script src="js/comenzi.js?v=20260913-orders-v1"></script></body></html>
