<!doctype html>
<html lang="ro" class="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; connect-src 'self' https://vkvsabbbawyiurnaiugo.supabase.co https://discord.com; font-src 'self' https: data:; form-action 'self';">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Comunicări</title>
  <link rel="stylesheet" href="css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/permissions.js?v=4.6.0"></script>
  <script src="js/panel-layout.js?v=4.12.0"></script>
  <link rel="stylesheet" href="css/anunturi.css">
  <link rel="stylesheet" href="css/global-footer.css">
  <script src="js/project-version.js"></script>
  <link rel="icon" href="img/favicon.ico">
  <link rel="apple-touch-icon" href="img/logo-180.png">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex text-sm">
<main class="flex-1 flex flex-col min-w-0 min-h-screen">
  <section class="community-shell flex-1" id="community-feed-shell">
    <div class="community-hero">
      <div><h2>📣 Comunicări</h2><p>Anunțuri, sondaje și evidență disciplinară pentru audiența permisă.</p></div>
      <button id="create-button" class="btn" hidden>+ Creează postare</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-filter="all">Toate</button><button class="tab" data-filter="organization">Organizație</button><button class="tab" data-filter="departments">Birouri / Angajați</button><button class="tab" data-filter="fine">Amenzi istorice</button><button class="tab" data-filter="poll">Sondaje</button><button class="tab discipline-tab" data-discipline-filter="warnings" hidden>Avertismente</button><button class="tab discipline-tab" data-discipline-filter="sanctions" hidden>Sancțiuni</button>
    </div>
    <div id="feed" class="feed"><div class="empty">Se încarcă…</div></div>
  </section>
  <section id="discipline-panel" class="community-shell" hidden><div class="discipline-toolbar"><div><h3 id="discipline-heading">Evidență disciplinară</h3><p id="discipline-description" class="muted">Vezi doar înregistrările pentru care ai acces.</p></div><button id="discipline-create-button" class="btn" hidden>+ Avertisment / sancțiune</button></div><div id="discipline-summary" class="discipline-summary"></div><div id="discipline-feed" class="feed"><div class="empty">Se încarcă…</div></div></section>
  <div data-panel-footer-host class="w-full mt-auto"></div>
</main>
<div id="post-modal" class="modal" hidden><section class="dialog"><h3 id="form-heading">Creează postare</h3><form id="post-form" class="form"><label>Tip<select id="post-type"><option value="announcement">Anunț</option><option value="question">Întrebare</option><option value="poll">Sondaj</option></select></label><label>Titlu<input id="post-title" maxlength="140" required></label><label>Conținut<textarea id="post-content" maxlength="4000" required></textarea></label><div id="poll-wrap" hidden><label>Opțiuni sondaj</label><div id="poll-options"></div><button type="button" id="add-option" class="btn secondary">+ Opțiune</button></div><div class="dialog-actions"><button type="button" data-close class="btn secondary">Renunță</button><button class="btn">Continuă</button></div></form></section></div>
<div id="audience-modal" class="modal" hidden><section class="dialog"><h3>Unde publici?</h3><p class="muted">Alegerea este obligatorie.</p><div class="audiences"><button data-audience="organization" class="audience">👥<br>Organizație</button><button data-audience="departments" class="audience">🔧<br>Birouri / Angajați</button></div><div class="dialog-actions"><button data-back class="btn secondary">Înapoi</button></div></section></div>
<div id="discipline-modal" class="modal" hidden><section class="dialog"><h3>Adaugă evidență disciplinară</h3><form id="discipline-form" class="form"><label>Tip<select id="discipline-kind"><option value="warning">Avertisment</option><option value="sanction">Sancțiune financiară</option></select></label><label>Categorie<select id="discipline-scope"><option value="departments">Birouri / Angajați</option><option value="organization">Organizație</option></select></label><label>Destinatar<select id="discipline-target" required></select></label><label>Motiv<textarea id="discipline-reason" maxlength="4000" minlength="3" required></textarea></label><label>Note suplimentare<textarea id="discipline-notes" maxlength="4000"></textarea></label><label>Link dovadă<input id="discipline-evidence" type="url" maxlength="500" placeholder="https://..."></label><div id="sanction-fields" class="discipline-sanction-fields" hidden><label>Sumă<input id="discipline-amount" type="number" min="0.01" step="0.01"></label><label>Monedă<input id="discipline-currency" value="USD" maxlength="8" placeholder="USD"></label><label>Termen de plată<input id="discipline-due" type="date"></label></div><div class="dialog-actions"><button type="button" data-discipline-close class="btn secondary">Renunță</button><button class="btn">Salvează</button></div></form></section></div>
<script src="js/anunturi.js"></script><script src="js/anunturi-discipline.js?v=20260813-discipline-delete"></script><script src="js/global-footer.js"></script>
</body></html>
